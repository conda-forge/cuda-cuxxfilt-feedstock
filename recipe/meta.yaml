{% set name = "cuda-cuxxfilt" %}
{% set version = "13.5.37" %}
{% set cuda_version = "13.5" %}
{% set platform = "linux-x86_64" %}  # [linux64]
{% set platform = "linux-ppc64le" %}  # [ppc64le]
{% set platform = "linux-sbsa" %}  # [aarch64]
{% set platform = "windows-x86_64" %}  # [win64]
{% set platform = "windows-arm64" %}  # [win and arm64]
{% set target_name = "x86_64-linux" %}  # [linux64]
{% set target_name = "ppc64le-linux" %}  # [ppc64le]
{% set target_name = "sbsa-linux" %}  # [aarch64]
{% set target_name = "x64" %}  # [win64]
{% set target_name = "arm64" %}  # [win and arm64]
{% set extension = "tar.xz" %}  # [not win]
{% set extension = "zip" %}  # [win]
{% set sha256 = "584b3c29ba719f63684bea9e038a2c1dba1146d535dcc50183dc1578704ceac3" %}  # [linux64]
{% set sha256 = "428827135fe57be512e3cc4f2d61b694a56042c4fc5ab7749150a2ba4f11ba96" %}  # [aarch64]
{% set sha256 = "2ed8e6207ab42db7e9e53011c569bca110e2da339a0487439359906b82f33aed" %}  # [win64]
{% set sha256 = "58f564912e8dcfc4249d124a2e8fbca452750844251865c73c29a1b76fe215a7" %}  # [win and arm64]

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://developer.download.nvidia.com/compute/cuda/redist/cuda_cuxxfilt/{{ platform }}/cuda_cuxxfilt-{{ platform }}-{{ version }}-archive.{{ extension }}
  sha256: {{ sha256 }}

build:
  number: 0
  binary_relocation: false
  skip: true  # [osx or ppc64le]

requirements:
  build:
    - {{ compiler("c") }}
    - {{ compiler("cxx") }}
    - {{ stdlib("c") }}
    - cf-nvidia-tools 1  # [linux]
  host:
    - cuda-version {{ cuda_version }}
  run:
    - {{ pin_compatible("cuda-version", max_pin="x.x") }}

test:
  requires:
    - patchelf  # [linux]
  files:
    - test-rpath.sh
  commands:
    - test -f $PREFIX/bin/cu++filt                                   # [linux]
    - test -f $PREFIX/targets/{{ target_name }}/include/nv_decode.h  # [linux]
    - test -f $PREFIX/targets/{{ target_name }}/lib/libcufilt.a      # [linux]
    - bash test-rpath.sh                                             # [linux]
    - if not exist %LIBRARY_BIN%\cu++filt.exe exit 1                 # [win]
    - if not exist %LIBRARY_INC%\\nv_decode.h exit 1                 # [win]
    - if not exist %LIBRARY_LIB%\{{ target_name }}\cufilt.lib exit 1  # [win]

about:
  home: https://developer.nvidia.com/cuda-toolkit
  license_file: LICENSE
  license: LicenseRef-NVIDIA-End-User-License-Agreement
  license_url: https://docs.nvidia.com/cuda/eula/index.html
  summary: cu++filt decodes low-level identifiers that have been mangled by CUDA C++
  description: |
    cu++filt decodes (demangles) low-level identifiers that have been mangled by
    CUDA C++ into user readable names. For every input alphanumeric word, the
    output of cu++filt is either the demangled name if the name decodes to a CUDA
    C++ name, or the original name itself.
  doc_url: https://docs.nvidia.com/cuda/index.html

extra:
  recipe-maintainers:
    - conda-forge/cuda
